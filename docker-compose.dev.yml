services:
  db:
    image: postgres:16-alpine
    env_file:
      - .env.production
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: cgr.dev/chainguard/minio@sha256:34a613c744354002d96e57b548bef0f11bddb427856960f4f821a46b60e3fb05
    user: "0"
    command: server /data --console-address ":9001"
    env_file:
      - .env.production
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  minio-init:
    image: docker.io/rclone/rclone@sha256:2687085f718d3c628f7fdfb77c52a1d344332aed543110bb88088f2c70d43eb5
    depends_on:
      minio:
        condition: service_started
    user: "0"
    volumes:
      - ./ops/storage-client-entrypoint.sh:/ops/storage-client-entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/ops/storage-client-entrypoint.sh"]
    command: ["ensure-bucket"]
    environment:
      MINIO_ENDPOINT: http://minio:9000
    env_file:
      - .env.production

  migrate:
    build:
      context: .
      target: builder
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.production
    environment:
      MINIO_ENDPOINT: http://minio:9000
    command: ["npx", "prisma", "migrate", "deploy"]

volumes:
  db-data:
  minio-data:
