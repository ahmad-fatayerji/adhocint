services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: adhocint
      POSTGRES_PASSWORD: adhocint
      POSTGRES_DB: adhocint
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: cgr.dev/chainguard/minio@sha256:34a613c744354002d96e57b548bef0f11bddb427856960f4f821a46b60e3fb05
    user: "0"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  minio-init:
    image: docker.io/rclone/rclone@sha256:2687085f718d3c628f7fdfb77c52a1d344332aed543110bb88088f2c70d43eb5
    depends_on:
      minio:
        condition: service_started
    user: "0"
    volumes:
      - ./ops/storage-client-entrypoint.sh:/ops/storage-client-entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/ops/storage-client-entrypoint.sh"]
    command: ["ensure-bucket"]
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
      MINIO_BUCKET: adhocint
      MINIO_ENDPOINT: http://minio:9000

  migrate:
    build:
      context: .
      target: builder
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://adhocint:adhocint@db:5432/adhocint
      MINIO_ENDPOINT: http://minio:9000
      MINIO_BUCKET: adhocint
      MINIO_ACCESS_KEY: minio
      MINIO_SECRET_KEY: minio12345
    command: ["npx", "prisma", "migrate", "deploy"]

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env.local
    environment:
      DISABLE_RATE_LIMITS: "true"
      PORT: 3001
      HOSTNAME: 0.0.0.0
      DATABASE_URL: postgresql://adhocint:adhocint@db:5432/adhocint
      MINIO_ENDPOINT: http://minio:9000
      MINIO_BUCKET: adhocint
      MINIO_ACCESS_KEY: minio
      MINIO_SECRET_KEY: minio12345
    ports:
      - "3001:3001"

volumes:
  db-data:
  minio-data:
